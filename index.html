<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <base href="/" />
    <link rel="icon" href="https://images.gc.barnsleyfcservices.co.uk/fit-in/170x170/3b17caf0-1393-11ef-9954-698e48ed286c.png" />
    <link rel="alternate" type="application/rss+xml" title="Barnsley FC Fan Advisory Board — News" href="/rss.xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Every route sets its own <title>/meta description/OG tags via <Seo> (src/components/Seo.tsx,
         built on react-helmet-async), rendered server-side by vite-react-ssg and baked into
         the static HTML for that route (FAB-008). No default <title> here to avoid a duplicate. -->
  </head>
  <body>
    <!-- Hidden copy of the Submit form so Netlify Forms detects the fields at build time. -->
    <form name="fab-submission" netlify netlify-honeypot="bot-field" data-netlify-recaptcha="true" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="topic" />
      <input type="text" name="member" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
      <div data-netlify-recaptcha="true"></div>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
