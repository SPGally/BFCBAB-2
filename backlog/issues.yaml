- id: FAB-018
  title: "Structured data: JSON-LD for FAQ entries, news articles, meetings and the organisation"
  milestone: M1
  wave: 3
  area: site
  size: S
  depends: [FAB-008]
  body: |
    ## Context
    Search engines and AI systems use schema.org structured data to extract question-and-answer pairs, article dates and events with confidence. Part of Paul's goal (22 Sep 2026) that the FAQ and news are findable and quotable by AI models.
    ## Scope
    - `src/lib/jsonld.ts` builds JSON-LD objects; each page emits one `<script type="application/ld+json">` via the head manager used by FAB-008:
      - `/faq`: `FAQPage` with every `Question`/`Answer` (answer text with HTML stripped, plus the entry URL).
      - `/faq/<id>`: the single `Question`/`Answer`, `dateModified` from git or a `updated` field if added.
      - `/news/<slug>`: `NewsArticle` with `headline`, `datePublished`, `author` (Person with the member's name and role), `image`, `publisher` (Organization "Barnsley FC Fan Advisory Board").
      - `/meetings/<id>`: `Event` with `startDate`, `location` (VirtualLocation for Teams), `organizer`.
      - `/minutes` and each minutes entry: `DigitalDocument`/`CreativeWork` with `url` of the PDF and `datePublished`.
      - Site-wide `Organization` with name, url, logo, `sameAs` (club FAB page, X, Facebook once known) and `contactPoint` (FAB@barnsleyfc.co.uk).
    - `BreadcrumbList` on detail pages.
    ## Out of scope
    Markdown mirrors (FAB-019).
    ## Acceptance tests
    - unit: each builder produces valid JSON-LD (validated against a small schema of required fields); the FAQPage count equals the number of published entries.
    - Google Rich Results Test passes for one FAQ page and one article (manual, recorded in the PR).
    ## Files touched
    src/lib/jsonld.ts, src/lib/jsonld.test.ts, src/pages/FAQ.tsx, src/pages/FAQDetails.tsx, src/pages/NewsArticle.tsx, src/pages/MeetingDetails.tsx, src/pages/Minutes.tsx, index.html

- id: FAB-019
  title: "llms.txt and Markdown mirrors of every FAQ entry, article and minutes entry"
  milestone: M1
  wave: 3
  area: site
  size: S
  depends: [FAB-007]
  body: |
    ## Context
    AI crawlers and browsing agents prefer plain text or Markdown to HTML, and the emerging `llms.txt` convention gives them an index of a site. Part of Paul's goal (22 Sep 2026).
    ## Scope
    - `scripts/build-llms.mjs`, run in `npm run build` after the feeds: writes `dist/llms.txt` (what the FAB is, one line per key page with its URL and a one-sentence summary, and links to the Markdown mirrors) and `dist/llms-full.txt` (every FAQ entry and article in full, plain text).
    - Markdown mirrors at stable URLs: `dist/faq/<id>.md`, `dist/news/<slug>.md`, `dist/minutes/<date>.md` (title, date, location, PDF link, extracted text), generated from the same content modules FAB-007 extracts. Each HTML page gets `<link rel="alternate" type="text/markdown" href="...">`.
    - `public/_headers`: `Content-Type: text/markdown; charset=utf-8` for `/*.md` and `text/plain` for `llms*.txt`.
    ## Acceptance tests
    - unit: every published FAQ entry and article has a mirror; `llms.txt` lists them; no relative URLs.
    - `curl https://.../faq/<id>.md` returns Markdown with the right content type (checked on the deploy preview, recorded in the PR).
    ## Files touched
    scripts/build-llms.mjs, package.json, public/_headers, index.html

- id: FAB-020
  title: "Titles, meta descriptions and canonical URLs on every page"
  milestone: M1
  wave: 3
  area: site
  size: S
  depends: [FAB-008]
  body: |
    ## Context
    With pages pre-rendered (FAB-008), each needs a distinct `<title>`, a `<meta name="description">` under 160 characters and a canonical URL so crawlers and AI search modes index the right page with the right summary. Today only news articles set a title.
    ## Scope
    - A small `PageMeta` component used by every page: Home, News list, article (summary), FAQ list, FAQ entry (first sentence of the answer), Minutes, Meetings, meeting detail, About Us, Submit, Visual History.
    - Canonical `<link rel="canonical">` using the site URL from one constant.
    - Home page `<title>` "Barnsley FC Fan Advisory Board" and a description that says what the FAB is in one sentence.
    ## Acceptance tests
    - unit: every route in the sitemap renders a title and description; none exceeds 160 characters; no two pages share a title.
    ## Files touched
    src/components/PageMeta.tsx, src/pages/*.tsx, src/lib/site.ts

- id: FAB-021
  title: "AI-readability check in CI: fetch each page type without JavaScript and assert the content is there"
  milestone: M1
  wave: 4
  area: ci
  size: S
  depends: [FAB-008, FAB-018, FAB-019, FAB-020]
  body: |
    ## Context
    Guards the whole AI-readability effort against regressions: a future change that moves content back into client-side rendering must fail CI.
    ## Scope
    - `scripts/check-ai-readable.mjs`: after `npm run build`, serve `dist/` locally, fetch one page of each type with plain `fetch` (no browser), and assert: headline and body text present; JSON-LD present and parseable with the expected `@type`; `<title>` and description present; `.md` mirror exists; `robots.txt` allows the AI user agents; `sitemap.xml` lists the page.
    - Run in `.github/workflows/ci.yml` after the build (protected path: Paul decided in this issue).
    ## Acceptance tests
    - CI fails when any assertion fails (proved by a deliberately broken commit in the PR description, then reverted).
    ## Files touched
    scripts/check-ai-readable.mjs, package.json, .github/workflows/ci.yml
