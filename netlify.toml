[build]
  command = "npm run build"
  publish = "dist"

# Handle all routes for the SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true # Ensure SPA routing works even for paths that might match static files

# Security headers
[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "text/javascript"

[[headers]]
  for = "/*.css"
  [headers.values]
    Content-Type = "text/css"

[[headers]]
  for = "/*.html"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self' https://images.gc.barnsleyfcservices.co.uk https://www.barnsleyfc.co.uk; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' https://www.google.com; media-src 'self'; object-src 'none'; frame-src https://www.google.com https://recaptcha.google.com; worker-src 'self' blob:;"