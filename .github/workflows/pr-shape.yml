name: PR shape

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Conventional title
        env: { TITLE: "${{ github.event.pull_request.title }}" }
        run: |
          echo "$TITLE" | grep -Eq '^(feat|fix|docs|chore|refactor|test|ci|perf|build|style|revert)(\([a-z0-9-]+\))?!?: .+' \
            || { echo "::error::PR title must be a conventional commit, e.g. 'feat(content): minutes index from src/data (#12)'"; exit 1; }
      - name: Body has Agent, Fixes and Handoff
        env: { BODY: "${{ github.event.pull_request.body }}" }
        run: |
          fail=0
          echo "$BODY" | grep -Eq '^Agent: *FAB ' || { echo "::error::Body needs a line 'Agent: FAB <Machine> <Role> <Model>'"; fail=1; }
          echo "$BODY" | grep -Eq '^(Fixes|Closes|Resolves|Refs) #[0-9]+' || { echo "::error::Body needs 'Fixes #N' (or 'Refs #N' for a PR that must not close the issue)"; fail=1; }
          echo "$BODY" | grep -Eq '^Handoff: *[^<[:space:]]' || { echo "::error::Body needs a filled 'Handoff:' line"; fail=1; }
          # every #N in the Fixes line must be preceded by a keyword
          line=$(echo "$BODY" | grep -E '^(Fixes|Closes|Resolves|Refs) ' | head -1)
          bad=$(echo "$line" | grep -oE '(^|[^a-zA-Z])#[0-9]+' | wc -l)
          good=$(echo "$line" | grep -oE '(Fixes|Closes|Resolves|Refs) #[0-9]+' | wc -l)
          [ "$bad" -eq "$good" ] || { echo "::error::Repeat the keyword per issue: 'Fixes #12, Fixes #13'"; fail=1; }
          exit $fail
