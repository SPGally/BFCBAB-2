name: Deploy

# Deploys `dist` to Cloudflare Pages (project `fab-barnsleyfc`) after CI succeeds on main.
#
# Netlify still deploys from main on its own (netlify.toml) and serves fab.barnsleyfc.co.uk
# until Paul switches DNS to Cloudflare (backlog milestone M2 "Cloudflare"). Until then
# this workflow only populates the Cloudflare Pages project; nothing user-facing changes.
#
# Gated on the CLOUDFLARE_API_TOKEN secret existing: the Cloudflare account and API token
# are Paul's. Written and validated here, but it does nothing against the real target until
# he provisions CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the repo secrets.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.workflow_run.head_sha }}" }
      - name: Check CLOUDFLARE_API_TOKEN is configured
        id: has-secret
        run: echo "present=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.has-secret.outputs.present == 'true'
        uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - if: steps.has-secret.outputs.present == 'true'
        run: npm ci
      - if: steps.has-secret.outputs.present == 'true'
        run: npm run build
      - if: steps.has-secret.outputs.present == 'true'
        name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=fab-barnsleyfc
      - if: steps.has-secret.outputs.present != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN not configured yet (Paul, milestone M2) -- skipping deploy. Netlify still deploys main."
